volumes:
  postgresql:
    name: ${COMPOSE_PROJECT_NAME}-postgresql
  kafka:
    name: ${COMPOSE_PROJECT_NAME}-kafka

services:
  apiserver:
    build: ./apiserver
    image: ecosync/aiot-data-apiserver:0.0.1
    volumes:
      - ./boot/target/aiot-data-boot-0.0.1-SNAPSHOT.jar:/opt/app/aiot-data-boot-0.0.1-SNAPSHOT.jar
    command: [ "java", "-jar", "/opt/app/aiot-data-boot-0.0.1-SNAPSHOT.jar" ]

  spark-sql:
    build: ./spark
    image: ecosync/spark:3.5.5
    ports:
      - "10000:10000"
    depends_on:
      spark-master:
        condition: service_started
    environment:
      - HIVE_SERVER2_THRIFT_BIND_HOST=0.0.0.0
      - HIVE_SERVER2_THRIFT_PORT=10000
      - SPARK_NO_DAEMONIZE=true
    command:
      - "/opt/spark/sbin/start-thriftserver.sh"
      - "--master"
      - "spark://spark-master:7077"

  spark-master:
    build: ./spark
    image: ecosync/spark:3.5.5
    environment:
      - SPARK_MASTER_HOST=0.0.0.0
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_NO_DAEMONIZE=true
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?}
      - AWS_REGION=${AWS_REGION:?}
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    command:
      - "/opt/spark/sbin/start-master.sh"

  spark-worker:
    build: ./spark
    image: ecosync/spark:3.5.5
    depends_on:
      spark-master:
        condition: service_started
    environment:
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1g
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_NO_DAEMONIZE=true
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?}
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    command:
      - "/opt/spark/sbin/start-worker.sh"
      - "spark://spark-master:7077"

  kafka:
    image: apache/kafka:3.9.0
    volumes:
      - kafka:/var/lib/kafka/data
    ports:
      - '19092:19092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://kafka:9092,PLAINTEXT://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${DATA_KAFKA_NUM_PARTITIONS:-1}
      KAFKA_LOG_DIRS: /var/lib/kafka/data

  postgresql:
    image: postgres:14.17
    environment:
      POSTGRES_PASSWORD: ${DATA_DATABASE_PASSWORD:?}
    volumes:
      - ./postgresql/initdb-postgresql.sh:/docker-entrypoint-initdb.d/initdb.sh
      - postgresql:/var/lib/postgresql/data

  nginx:
    image: nginx:1.27.4
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/templates:/etc/nginx/templates
