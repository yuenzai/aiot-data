server:
  servlet:
    context-path: /apiserver
  forward-headers-strategy: framework
---
spring:
  application:
    name: aiot-data-apiserver
---
spring:
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArraySerializer
    listener:
      ack-mode: manual
    streams:
      application-id: ${spring.application.name}-streams
      bootstrap-servers: ${spring.kafka.bootstrap-servers}
      cleanup:
        on-startup: true
        on-shutdown: true
      state-dir: rocksdb
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$ByteArraySerde
        num.stream.threads: 1
        default.dsl.store: rocksDB
      auto-startup: true
---
logging:
  pattern:
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}){} %clr(${PID:}){magenta} %clr(--- %esb(){APPLICATION_NAME}%esb{APPLICATION_GROUP}[%15.15t] ${LOG_CORRELATION_PATTERN:}){faint}%clr(%-40.40logger{39}){cyan} %clr(:){faint} %esb(%mdc){}%m%esb(%kvp){}%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"
